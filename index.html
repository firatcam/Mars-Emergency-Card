*,*::before,*::after{box-sizing:inherit;margin:0}

radial-gradient(60% 38% at 8% 6%, #3fde793d, transparent 70%), radial-gradient(50% 34% at 100% 20%, #df6e7354, transparent 70%), radial-gradient(60% 38% at 0% 52%, #b93d4140, transparent 70%
70%

/* Apple-style liquid glass */
.glass{position:relative;isolation:isolate;border-radius: 0px;background:linear-gradient(145deg,rgba(255,255,255,.62),rgba(255,255,255,.2) 55%,rgba(255,255,255,.38));-webkit-backdrop-filter:blur(22px) saturate(200%);backdrop-filter:blur(22px) saturate(200%);box-shadow:inset 0 2px 1px rgba(255, 255, 255, .95), inset 0 -2px 3px rgba(255, 255, 255, .55), inset 2px 0 2px -1px rgb(0 0 0 / 9%), inset -2px 0 2px -1px rgb(0 0 0 / 3%), inset 0 0 26px rgba(255, 255, 255, .4), 0 14px 32px -14px rgb(0 0 0 / 17%), 0 2px 4px rgb(0 0 0 / 7%);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(120% 70% at 20% -10%,rgba(255,255,255,.75),transparent 55%),radial-gradient(80% 50% at 100% 110%,rgba(255,255,255,.5),transparent 60%);pointer-events:none}
svg{width:1.2em;height: 1.2em;fill:none;stroke: #FFF;stroke-width: 1.5px;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

a:focus-visible,select:focus-visible{outline:2px solid #a46bd0;outline-offset:2px}

.lang{position:relative;height: 50px;border-radius: 0px;}
.lang select{position:absolute;inset:0;width:100%;height:100%;appearance:none;-webkit-appearance:none;background:transparent;border:0;border-radius:inherit;font: 400 16px var(--b);color:var(--peach);padding:0 55px;cursor:pointer;text-align:start}
.lang svg{position:absolute;top:10%;margin-top:0em;pointer-events:none;color: #b93d41;width: 10%;height: 80%; stroke: #df6e73;}
.lang .gb{inset-inline-start:10px}
.lang .cv{inset-inline-end:20px;width:1.1em;height:1.1em;margin-top:0.65em;color:var(--mute)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding: 35px;}
h1{font: 800 66px/.88 var(--d);letter-spacing: -0.02em;background: linear-gradient(160deg, #df6e73 30%, #b93d41);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform: uppercase;}
.tag{display:flex;align-items:center;gap:8px;padding-bottom: 14px;font: 200 14px/1.2 var(--b);color:var(--mute);text-align:end}
.tag i{display:grid;place-items:center;width:30px;height:30px;border-radius: 3px;flex:none;color:#fff;background:linear-gradient(135deg,var(--rose),var(--peach));box-shadow: inset 0 1px 1px #ffffff, 0 6px 14px -4px #ffffff;}
.tag svg{width:16px;height:16px;stroke-width:2.8}
.intro{padding: 0px 35px 35px 35px;color:var(--mute);font-size: 15px;}

.id{display:grid;grid-template-columns:minmax(0,48%) minmax(0,1fr);gap: 40px;padding: 0px;}
.id>img{width: 110%;height:100%;min-height:230px;object-fit:cover;border-radius: 0px;}
dl{display:flex;flex-direction:column;justify-content:space-between;padding: 20px 0px 20px 0px;}
dl div{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding:1px 0 5px}
dl div:last-child{border:0}
dt{font-size:9.5px;color:var(--mute);font-weight:600; letter-spacing: 0.05em}
dd{font:700 14px var(--b)}
dd.chip{font-size: 13px;color:#333;letter-spacing:.02em;direction:ltr;text-align:start;unicode-bidi:isolate}

.who{display:flex;flex-direction:column;gap:12px;padding: 15px;}
.who h2{font:200 16px var(--d);display:flex;align-items:center;gap:10px;}
.who h2 span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background: linear-gradient(145deg, #df6e73, #b93d41);box-shadow: inset 0 1px 1px #ffffff, 0 4px 10px -4px rgb(107 107 107 / 50%);color: #000000;}
.row{display:grid;grid-template-columns: repeat(3,1fr);gap:8px}

/* buttons: left-to-right inner gradient fill on hover */
.btn{--t1: #fff;--t2: #cfcfcf;--h1: #aaaaaa;--h2: #7d7d7d;--tx: #444444;--hx:#fff;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 4px;border-radius: 5px;text-decoration:none;font-weight:700;font-size:12.5px;line-height:1.2;text-align:center;color: #ffffff;background:linear-gradient(90deg,var(--h1),var(--h2)) no-repeat left center/0% 100%,linear-gradient(180deg,var(--t1),var(--t2));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -2px 3px rgba(255,255,255,.35),0 8px 16px -8px rgba(58,46,77,.4);transition:background-size .6s cubic-bezier(.25,.8,.25,1),color .35s .05s,transform .15s}
.btn:hover,.btn:focus-visible,.btn:active{background-size:100% 100%,100% 100%;color:var(--hx)}
.btn:active{transform:scale(.97)}
.call{--t1: #df6e73;--t2: #b93d41;--h1: #df6e73;--h2: #df6e73;--tx: #df6e73;--hx: #ffffff;}
.wa{--t1:#45e47f;--t2:#1fbf58;--h1:#0f8f7e;--h2:#25d366;--tx:#fff;--hx:#fff}
.mail{--t1: #b93d41;--t2: #df6e73;--h1: #df6e73;--h2: #df6e73;--tx: #b93d41;--hx:#fff}
.dir{--t1: #df6e73;--t2: #b93d41;--h1: #df6e73;--h2: #df6e73;--tx: #df6e73;--hx: #fff;}
.live{padding:17px 12px;font-size:15px;gap:10px;border-radius: 5px;}
.live svg{width:1.4em;height:1.4em}

.warn{display:grid;grid-template-columns: 116px 1fr;padding: 20px;}
.warn>div{display:grid;place-items:center;border-radius: 5px;background: linear-gradient(
127deg, #b93d41, #df6e73);border-inline-end:1px solid rgba(255,255,255,.7);color:#d9731f}
.warn svg{width: 60px;height: 60px;}
.warn p{padding: 0px 20px 0px 20px;font-size: 15px;color:var(--mute);line-height: 1.46em;}

.vet{display:grid;grid-template-columns: minmax(0,50%) minmax(0,1fr);align-items:start;gap: 30px;padding: 0px 0px 0px 0px;timeline-scope:--g}
.gl{display:flex;flex-direction:column;gap: 9px;min-width:0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap: 0px;border-radius: 0px;scrollbar-width:none;aspect-ratio: 3/4.1;width:100%;scroll-timeline:--g inline}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;min-width:0;display:block;object-fit:cover;scroll-snap-align:center;border-radius: 0px;}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;height:12px}
.dots i{display:block;width:6px;height:6px;border-radius:9px;background:rgba(58,46,77,.25);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.dots i:first-child{width:20px;background:linear-gradient(90deg,var(--rose),var(--peach))}
@keyframes mid{0%,100%{width:6px;background:rgba(58,46,77,.25)}50%{width:20px;background:#ff8fa8}}
@keyframes first{from{width:20px;background:#ff8fa8}to{width:6px;background:rgba(58,46,77,.25)}}
@keyframes last{from{width:6px;background:rgba(58,46,77,.25)}to{width:20px;background:#ff9a95}}
@supports (animation-timeline:scroll()){
.dots i{animation:mid linear both;animation-timeline:--g}
.dots i:nth-child(1){animation-name:first;animation-range:0% 25%}
.dots i:nth-child(2){animation-range:0% 50%}.dots i:nth-child(3){animation-range:25% 75%}.dots i:nth-child(4){animation-range:50% 100%}
.dots i:nth-child(5){animation-name:last;animation-range:75% 100%}}
.vi{display:flex;flex-direction:column;gap: 10px;padding: 20px 20px 20px 0px;}
.badge{display:flex;align-items:center;gap:8px;font:800 30px/1 var(--d);letter-spacing:-.03em;color:#df6e73}
.badge i{display:grid;place-items:center;width:26px;height:26px;border-radius: 0px;color:#fff;background:linear-gradient(135deg,var(--rose),var(--peach));box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}
.badge svg{width:14px;height:14px;stroke-width:3}
.vi small{color:var(--mute);font-size:12.5px;font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.vi h3{font:800 20px/1.1 var(--d);letter-spacing:-.02em}
.vi address{font-style:normal;font-size:12.5px;color:var(--mute);margin-bottom:auto}
.vi .btn{margin-top:2px;padding:10px 4px}

.vac{padding:30px}
.vac h2{font:800 19px/1.2 var(--d);letter-spacing:-.02em;margin-bottom:10px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:700;color:var(--mute);text-align:start;padding:5px 4px 8px;font-size:11px}
td{padding:10px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{font:700 13px var(--d)}
td:nth-child(2){color:var(--mute)}
td:last-child{color:#b93d41;font-weight:700}
</style>

  <p class="intro"><t tr="Mars’ı bulduysanız, lütfen öncelikle bize ulaşmak için tüm iletişim kanallarını deneyin. Bizlere ulaşamamanız durumunda, 7/24 acil ulaşabileceğiniz veteriner kliniğinin iletişim numaralarını kullanabilirsiniz. Duyarlılığınız, ilginiz ve yardımınız için şimdiden çok teşekkür ederiz. Mars’ın güvenle bize kavuşmasına sağlayacağınız her türlü destek bizim için çok değerli. ❤️" en="If you find Mars, please try all available ways to contact us first. If you cannot reach us, please use the contact numbers for the 24/7 emergency veterinary clinic. Thank you in advance for your kindness, care, and help. Every effort that helps Mars return safely to us means a great deal. ❤️" es="Si encuentras a Mars, intenta primero contactar con nosotros por todos los medios disponibles. Si no consigues localizarnos, utiliza los teléfonos de la clínica veterinaria de urgencias disponible las 24 horas.
Muchas gracias de antemano por tu atención, amabilidad y ayuda. Cualquier esfuerzo para que Mars vuelva sano y salvo con nosotros significa mucho. ❤️" fr="Si vous trouvez Mars, essayez d’abord de nous contacter par tous les moyens disponibles. Si vous n’arrivez pas à nous joindre, utilisez les coordonnées de la clinique vétérinaire d’urgence ouverte 24 h/24 et 7 j/7. Merci d’avance pour votre attention, votre gentillesse et votre aide. Chaque geste qui aide Mars à nous retrouver sain et sauf compte beaucoup pour nous. ❤️" ru="Если вы нашли Марса, сначала попробуйте связаться с нами всеми доступными способами. Если связаться не удастся, воспользуйтесь телефонами круглосуточной ветеринарной клиники. Большое спасибо за ваше внимание, доброту и помощь. Любая помощь, которая позволит Марсу благополучно вернуться домой, очень важна для нас. ❤️" ar="إذا عثرت على مارس، يُرجى محاولة التواصل معنا أولاً عبر جميع وسائل الاتصال المتاحة. إذا لم تتمكن من الوصول إلينا، فاستخدم أرقام عيادة الطوارئ البيطرية المتاحة على مدار الساعة. شكراً جزيلاً مقدماً على اهتمامكم ولطفكم ومساعدتكم. كل ما يساعد مارس على العودة إلينا بأمان يعني لنا الكثير. ❤️" de="Wenn Sie Mars gefunden haben, versuchen Sie bitte zunächst, uns über alle verfügbaren Kommunikationswege zu erreichen. Sollten Sie uns nicht erreichen können, können Sie sich im Notfall an die Telefonnummern der Tierklinik wenden, die rund um die Uhr, 24 Stunden am Tag und 7 Tage die Woche, erreichbar ist. Wir bedanken uns schon jetzt von ganzem Herzen für Ihre Rücksichtnahme, Ihre Aufmerksamkeit und Ihre Hilfe. Jede Unterstützung, die dazu beiträgt, dass Mars sicher zu uns zurückkehren kann, bedeutet uns sehr viel. ❤️" it="Se avete trovato Mars, vi preghiamo innanzitutto di provare a contattarci attraverso tutti i canali di comunicazione disponibili. Se non riuscite a raggiungerci, potete utilizzare i numeri di telefono della clinica veterinaria, disponibile 24 ore su 24, 7 giorni su 7, per le emergenze. Vi ringraziamo fin da ora di cuore per la vostra sensibilità, attenzione e disponibilità ad aiutarci. Ogni gesto che possa contribuire a far tornare Mars sano e salvo da noi è per noi davvero prezioso. ❤️"></t></p>
